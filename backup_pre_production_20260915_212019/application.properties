server.port=8080
spring.application.name=bad-review-control

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/database/badreview
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# CORS
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# OCR Configuration
ocr.python.executable=python
ocr.script.path=python/ocr_subprocess.py
ocr.timeout.seconds=30
ocr.confidence.threshold=0.7

# Directory Configuration
temp.dir=data/temp
screenshot.dir=data/screenshots
debug.dir=data/debug

# Debug Mode
debug.mode=true

# Robot Configuration
robot.click.delay.ms=100
robot.type.delay.ms=50
robot.move.delay.ms=20

# AWT Configuration - 禁用 Headless 模式以支持 Robot 自动化
java.awt.headless=false
