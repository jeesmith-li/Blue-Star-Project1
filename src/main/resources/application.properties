server.port=8080
spring.application.name=bad-review-control

# SQLite Database（WAL：读写不互斥，批量写入明显更快）
spring.datasource.url=jdbc:sqlite:data/database/badreview.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# 前端静态资源禁缓存：浏览器每次协商验证，避免更新后仍加载旧页面
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# 批量写入：几百条评价入库减少往返
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Error Handling - Production Security
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# CORS - Production Configuration
# 生产环境请修改为实际的前端域名，多个域名用逗号分隔
# 示例: cors.allowed-origins=https://yourdomain.com,https://admin.yourdomain.com
cors.allowed-origins=http://localhost:3000

# OCR Configuration
ocr.python.executable=python-runtime/python.exe
ocr.script.path=python/ocr_subprocess.py
ocr.timeout.seconds=30
ocr.confidence.threshold=0.7

# Directory Configuration
temp.dir=data/temp
screenshot.dir=data/screenshots
debug.dir=data/debug
upload.dir=data/uploads

# Multipart (申诉图片上传)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Debug Mode
debug.mode=false

# Robot Configuration
robot.click.delay.ms=100
robot.type.delay.ms=50
robot.move.delay.ms=20

# AWT Configuration - 禁用 Headless 模式以支持 Robot 自动化
java.awt.headless=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.meituan=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=ERROR

# Logging File Configuration
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
